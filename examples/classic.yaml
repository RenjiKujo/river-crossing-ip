# Canonical classic instance (wolf, goat, cabbage)
puzzle_type: classic

items:
  - farmer
  - wolf
  - goat
  - cabbage

capacity: 2

pilots:
  - farmer

forbidden_co_presence:
  - members: [wolf, goat]
    guardians: [farmer]
    description: Farmer must mediate when wolf and goat share a location
  - members: [goat, cabbage]
    guardians: [farmer]
    description: Farmer must mediate when goat and cabbage share a location

initial_far_side: []

buffer_time: 1
